services:
  - type: web
    name: osho-api
    # The Dockerfile installs the system libs MediaPipe needs and preloads the
    # pose model, which a plain Python runtime would not do.
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Your Supabase project's JWT Secret (Settings -> API -> JWT Secret).
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DEBUG
        value: "false"
