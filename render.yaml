services:
  - type: web
    name: osho-api
    # The Dockerfile installs the system libs MediaPipe needs and preloads the
    # pose model, which a plain Python runtime would not do.
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # This API's own signing secret, unrelated to Supabase. Render prompts for
      # it because of sync: false. See .env.example.
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DEBUG
        value: "false"
